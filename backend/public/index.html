<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>Book Catalog</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>
<body class="container py-4">
  <h1 class="mb-4">Book Catalog</h1>

  <!-- ===== Catalog ===== -->
  <h3>หมวดหมู่ (Catalog)</h3>
  <form id="catalogForm" class="row g-2 mb-2">
    <input type="hidden" id="catalogId" />
    <div class="col-md-6"><input id="catalogName" class="form-control" placeholder="ชื่อหมวดหมู่" /></div>
    <div class="col-md-6">
      <button class="btn btn-primary">บันทึก</button>
      <button type="button" id="catalogCancel" class="btn btn-secondary">ยกเลิก</button>
    </div>
  </form>
  <table class="table table-bordered">
    <thead><tr><th>ID</th><th>ชื่อ</th><th>จัดการ</th></tr></thead>
    <tbody id="catalogTable"></tbody>
  </table>

  <!-- ===== Books ===== -->
  <h3 class="mt-4">หนังสือ (Books)</h3>
  <form id="bookForm" class="row g-2 mb-2">
    <input type="hidden" id="bookId" />
    <div class="col-md-3"><input id="title" class="form-control" placeholder="ชื่อหนังสือ" /></div>
    <div class="col-md-3"><input id="author" class="form-control" placeholder="ผู้แต่ง" /></div>
    <div class="col-md-2"><input id="publishedYear" type="number" class="form-control" placeholder="ปีที่พิมพ์" /></div>
    <div class="col-md-2"><select id="bookCatalog" class="form-select"></select></div>
    <div class="col-md-2 form-check pt-2 ps-5"><input id="isAvailable" type="checkbox" class="form-check-input" /> ยืมได้</div>
    <div class="col-md-6"><input id="cover" type="file" accept="image/*" class="form-control" /></div>
    <div class="col-md-6">
      <button class="btn btn-primary">บันทึก</button>
      <button type="button" id="bookCancel" class="btn btn-secondary">ยกเลิก</button>
    </div>
  </form>
  <table class="table table-bordered align-middle">
    <thead><tr><th>ปก</th><th>ID</th><th>ชื่อ</th><th>ผู้แต่ง</th><th>ปี</th><th>หมวด</th><th>สถานะ</th><th>จัดการ</th></tr></thead>
    <tbody id="bookTable"></tbody>
  </table>

  <script src="app.js"></script>
</body>
</html>
